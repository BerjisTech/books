<header>
  <h1>Berjis Books</h1>
  <nav>
    <a routerLink="/">Home</a>
    <a routerLink="/marketplace">Marketplace</a>
    <a routerLink="/clubs">Book Clubs</a>
    <a routerLink="/meetups">Meetups</a>
    <a routerLink="/orders">Orders</a>
  </nav>
  <div *ngIf="isDev" style="margin-top:8px; padding:8px; background:#f8fafc10; border:1px solid #e5e7eb22; border-radius:6px;">
    <div style="font-weight:600;">Dev Info</div>
    <div style="font-size:13px; opacity:.85;">Core API: {{ coreBase }}</div>
    <div style="font-size:13px; opacity:.85;">Books API: {{ booksBase }}</div>
    <div style="margin-top:6px; font-size:12px;">
      <label>Set Books API Base: </label>
      <input [(ngModel)]="newBooksBase" placeholder="http://localhost:8088 or https://..." style="width:380px" />
      <button (click)="saveBooksBase()">Apply</button>
    </div>
  </div>
  <p style="opacity:.7;max-width:70ch">
    Authors and publishers collaborate; readers buy ebooks or hard copies, share where allowed, form clubs, chat in rooms, and attend meetups.
  </p>
</header>
<main>
  <router-outlet />
</main>
